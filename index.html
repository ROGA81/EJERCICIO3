<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Precio de Venta 💼</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- jsPDF para exportar a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- jsPDF AutoTable plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      background-color: #1f1f1f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 800px;
      margin-top: 60px;
    }
    .card {
      background-color: #2c2c2c;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }
    .form-control {
      background-color: #333;
      color: #ffffff;
      border: 1px solid #555;
    }
    .form-control::placeholder {
      color: #cccccc;
    }
    .form-label {
      color: #f1f1f1;
    }
    .btn-primary, .btn-success, .btn-danger {
      margin-top: 1rem;
    }
    .btn-success {
      background-color: #198754;
      border: none;
    }
    .btn-danger {
      background-color: #dc3545;
      border: none;
    }
    .result-box {
      background-color: #212529;
      padding: 1.2rem;
      border-radius: 0.8rem;
      margin-top: 1.5rem;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
      color: #f8f9fa;
    }
    table {
      margin-top: 2rem;
    }
    th, td {
      color: #fff;
      background-color: #2c2c2c;
    }
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container animate__animated animate__fadeIn">
    <div class="card p-4">
      <h2 class="text-center mb-4">🧮 Calculadora de Precio de Venta</h2>
      <form id="formulario">
        <div class="mb-3">
          <label for="concepto" class="form-label">Concepto o nombre del producto</label>
          <input type="text" class="form-control" id="concepto" placeholder="Ej. Reloj clásico" required>
        </div>
        <div class="mb-3">
          <label for="costoBase" class="form-label">Costo base del producto</label>
          <input type="number" class="form-control" id="costoBase" placeholder="Ingresa el costo base" required>
        </div>
        <div class="mb-3">
          <label for="porcentajeGanancia" class="form-label">Porcentaje de ganancia deseado (%)</label>
          <input type="number" class="form-control" id="porcentajeGanancia" placeholder="Ej. 30" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Calcular</button>
      </form>
      <div id="resultadoFinal" class="result-box text-center mt-4">
        <h4>💰 Precio sugerido:</h4>
        <p id="precioFinal" style="font-size: 1.8rem; font-weight: bold;">$0.00</p>
      </div>

      <table class="table table-bordered table-hover mt-4" id="tablaResultados">
        <thead>
          <tr>
            <th>Concepto</th>
            <th>Costo Base</th>
            <th>% Ganancia</th>
            <th>Precio Sugerido</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Botón flotante de WhatsApp -->
  <a href="https://wa.me/5216646934801?text=Hola%2C%20vi%20tu%20calculadora%20y%20me%20interesa%20más%20información." 
     class="whatsapp-float" 
     target="_blank" 
     title="Contáctanos por WhatsApp">
    <img src="https://cdn-icons-png.flaticon.com/512/220/220236.png" 
         alt="WhatsApp" 
         style="width:60px;height:60px;">
  </a>

  <script>
    function mostrarPrecioFinal(precio) {
      document.getElementById("precioFinal").textContent = "$" + precio.toFixed(2);
    }

    function agregarFila(concepto, costo, ganancia, precioFinal) {
      const tabla = document.getElementById("tablaResultados").querySelector("tbody");
      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${concepto}</td>
        <td>$${costo.toFixed(2)}</td>
        <td>${ganancia}%</td>
        <td>$${precioFinal.toFixed(2)}</td>
      `;
      tabla.appendChild(fila);
    }

    document.getElementById("formulario").addEventListener("submit", function(event) {
      event.preventDefault();
      const concepto = document.getElementById("concepto").value.trim();
      const costo = parseFloat(document.getElementById("costoBase").value);
      const ganancia = parseFloat(document.getElementById("porcentajeGanancia").value);

      if (concepto && !isNaN(costo) && !isNaN(ganancia)) {
        const precioFinal = costo + (costo * (ganancia / 100));
        mostrarPrecioFinal(precioFinal);
        agregarFila(concepto, costo, ganancia, precioFinal);
        document.getElementById("formulario").reset();
      }
    });
  </script>
</body>
</html>
